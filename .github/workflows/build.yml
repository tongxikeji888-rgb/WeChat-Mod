name: Build DEB

on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Get iOS SDK
        run: |
          git clone https://github.com/xybp888/iOS-SDKs $HOME/theos/sdks/iOS14.5.sdk
          mv $HOME/theos/sdks/iOS14.5.sdk $HOME/theos/sdks/iPhoneOS14.5.sdk

      - name: Build Package
        run: |
          make package FINALPACKAGE=1

      - name: Upload DEB
        uses: actions/upload-artifact@v3
        with:
          name: WeChatMod-DEB
          path: packages/*.deb
