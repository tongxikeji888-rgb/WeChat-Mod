name: Build DEB

on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos (Manual Mode)
        run: |
          # 重点在这里！我们不再用那个报错的 install-theos 脚本
          # 而是直接手动克隆，这样就不需要访问 API 了！
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Get iOS SDK (ZIP Mode)
        run: |
          # 1. 清理环境
          rm -rf $HOME/theos/sdks
          mkdir -p $HOME/theos/sdks
          
          # 2. 直接下载 ZIP 包 (比 git clone 稳定 100 倍，不会断连)
          # 我们用 iOS 14.5 SDK，兼容性最好，文件也小
          curl -L -o sdk.zip https://github.com/xybp888/iOS-SDKs/raw/master/iPhoneOS14.5.sdk.zip
          
          # 3. 解压
          unzip -q sdk.zip -d $HOME/theos/sdks/
          
          # 4. 确认一下文件在不在
          ls -l $HOME/theos/sdks/

      - name: Build Package
        run: |
          # 强制指定 SDK 版本
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless TARGET=iphone:clang:latest:14.5
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WeChatMod-Rootless
          path: packages/*.deb
